global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sdl-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels: { service: api }

  - job_name: sdl-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3100"]
        labels: { service: worker }

  - job_name: sdl-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3200"]
        labels: { service: scheduler }
